<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Takas Sistemi</title>
  <link rel="stylesheet" href="trade.css" />
</head>
<body>

  <header>
    <h1>Takas Sistemi</h1>
    <button id="view-lineups-btn">Kadroları Görüntüle</button>
  </header>

  <main>
    <section id="input-section">
  <label for="trade-count-input" id="trade-count-label">Toplam Takas Hakkı:</label>
  <input type="number" id="trade-count-input" min="1" max="100" />

  <label for="protect-count-input" id="protect-count-label">Kullanıcı Başına Koruma Hakkı:</label>
  <input type="number" id="protect-count-input" min="1" max="11" />

  <button id="generate-trade-fields-btn">Takaslara Başla</button>
</section>


    <section id="trade-fields-container"></section>
  </main>

  <div style="text-align: center; margin-top: 20px;">
    <button id="submit-trades-btn" style="display: none;">Takasları Bitir</button>
  </div>

  <script src="trade.js"></script>
</body>
</html>
